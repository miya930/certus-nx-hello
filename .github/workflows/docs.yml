name: Design documents

# 設計情報のサイトを組み立て、main に入ったものを GitHub Pages に公開する。
# プルリクエストでは、組み立てが通ることだけを確認する。
on:
  push:
    branches: [main]
    paths:
      - README.md
      - projects/**
      - docs/**
      - site/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - projects/**
      - docs/**
      - site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # 最終更新日をファイルごとのコミットから求めるため、履歴を全て取得する。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
