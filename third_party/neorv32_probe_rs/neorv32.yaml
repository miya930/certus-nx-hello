# probe-rs に、各プロジェクトのコアのメモリの位置を教える。
# 命令メモリは RAM で、JTAG から書き込んだあとリセットすると、起動 ROM が先頭へ飛ぶ。
# FLASH は SPI Flash のうち、firmware image を置く範囲である。
# 書き込みプログラムは flash_algorithms/mt25q から target-gen elf で作った。
name: NEORV32
variants:
  # 位置と大きさは projects/managed_switch の hdl/managed_switch.vhd の generic と firmware/memory.x に合わせる。
  - name: managed_switch
    cores:
      - name: main
        type: riscv
        core_access_options: !Riscv
    memory_map:
      - !Ram
        name: IMEM
        range:
          start: 0x00000000
          end: 0x00010000
        cores:
          - main
        access:
          boot: true
      - !Ram
        name: DMEM
        range:
          start: 0x80000000
          end: 0x80004000
        cores:
          - main
      - !Nvm
        name: FLASH
        range:
          start: 0x00f00000
          end: 0x00f20000
        cores:
          - main
    flash_algorithms:
      - mt25q
  # 位置と大きさは projects/riscv_rust の riscv_rust.vhd の generic と firmware/memory.x に合わせる。
  - name: riscv_rust
    cores:
      - name: main
        type: riscv
        core_access_options: !Riscv
    memory_map:
      - !Ram
        name: IMEM
        range:
          start: 0x00000000
          end: 0x00004000
        cores:
          - main
        access:
          boot: true
      - !Ram
        name: DMEM
        range:
          start: 0x80000000
          end: 0x80002000
        cores:
          - main
flash_algorithms:
  - name: mt25q
    description: MT25QU128
    default: true
    instructions: 
    load_address: 0x80000020
    pc_init: 0x58
    pc_uninit: 0x1fa
    pc_program_page: 0x130
    pc_erase_sector: 0x0
    pc_read: 0x1a4
    data_section_offset: 0x4ac
    flash_properties:
      address_range:
        start: 0x00f00000
        end: 0x00f20000
      page_size: 0x100
      erased_byte_value: 0xff
      program_page_timeout: 1000
      erase_sector_timeout: 2000
      sectors:
        - size: 0x1000
          address: 0x0
    cores:
      - main
