[build]
target = "riscv32imc-unknown-none-elf"
# ビルド生成物は、他のプロジェクトと同じく build/ の下に出す。
target-dir = "../build/firmware"

[target.riscv32imc-unknown-none-elf]
# defmt.x は、defmt のログの書式を ELF に残す。probe-rs はそれを読んでログを復号する。
rustflags = ["-C", "link-arg=-Tmemory.x", "-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]
# cargo run で、ファームウェアを SPI Flash に書き、続けて命令メモリにも書いてコアをリセットし、実行させる。
# 電源を入れた直後は、起動 ROM が Flash のファームウェアを命令メモリにコピーして実行する。
runner = "../../../tools/firmware_flash/firmware_flash.py"

# cargo run-ram は、Flash を書き換えず、命令メモリにだけ書いて実行する。
[alias]
run-ram = ["run", "--config", "target.riscv32imc-unknown-none-elf.runner='probe-rs run'"]

[env]
# defmt は既定では error しか出さないため、info 以上を出す。
DEFMT_LOG = "info"
# probe-rs の設定は、コマンドの引数の代わりに環境変数で渡す。
PROBE_RS_CHIP = "managed_switch"
PROBE_RS_CHIP_DESCRIPTION_PATH = { value = "../neorv32.yaml", relative = true }
# probe-rs はボードの FTDI もプローブとして見つけるため、rust-dap を VID:PID で選ぶ。
PROBE_RS_PROBE = "6666:4444"
PROBE_RS_PROTOCOL = "jtag"
# NEORV32 は TCK をコアのクロックで取り込むため、TCK の上限は 25 MHz の 1/5 の 5 MHz になる。
# 上限に対して余裕を持たせ、1 MHz にする。
PROBE_RS_SPEED = "1000"
