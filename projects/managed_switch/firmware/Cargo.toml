[package]
name = "managed_switch_firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18", features = ["single-hart"] }
panic-halt = "1.0"
# 端末の UART を共有するために critical-section を使い、単一ハートの実装を riscv から取る。
riscv = { version = "0.16", features = ["critical-section-single-hart"] }
critical-section = "1"
embedded-hal = "1"
embedded-io = "0.7"
neorv32-hal = { path = "../../../crates/neorv32-hal" }

[dependencies.smoltcp]
version = "0.14"
default-features = false
# ソケットを 1 つも有効にしないと smoltcp の Socket 列挙が空になり、組み上がらない。
# ICMP の echo への自動応答は auto-icmp-echo-reply で囲まれており、無いと要求が捨てられる。
features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "auto-icmp-echo-reply"]

# cargo run は開発用のビルドを使う。
# 命令メモリは 64 KB で、検査を入れた開発用のビルドは入りきらないため、リリースと同じ中身にする。
[profile.dev]
opt-level = "z"
lto = true
codegen-units = 1
debug-assertions = false
overflow-checks = false

# 命令メモリが限られるため、速度より大きさを優先する。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
