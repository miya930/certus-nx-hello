[package]
name = "managed_switch_firmware"
version = "0.1.0"
edition = "2021"

# no_std の対象には test クレートがないため、テストとベンチマークは組み立てられない。
# rust-analyzer が全ての対象を検査しても失敗しないよう、対象から外す。
[[bin]]
name = "managed_switch_firmware"
test = false
bench = false

[dependencies]
riscv-rt = { version = "0.18", features = ["single-hart"] }
# PAC の Peripherals::take と defmt-rtt は critical-section を使うため、単一ハートの実装を riscv から取る。
riscv = { version = "0.16", features = ["critical-section-single-hart"] }
defmt = "1"
# probe-rs は、RTT のバッファが満杯なら書き手を待たせるモードにする。
# そのままでは probe-rs が切れたあとにログを書くところで止まるため、満杯でも待たずに書くモードに固定する。
# このモードでは、まだ読まれていない古いログは上書きされる。
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }
embedded-hal = "1"
neorv32-hal = { path = "../../../crates/neorv32-hal" }
mt25q = { path = "../../../crates/mt25q" }
satcat5-pac = { path = "../../../crates/satcat5-pac" }
managed_switch_logic = { path = "../logic" }

[dependencies.smoltcp]
version = "0.14"
default-features = false
# ソケットを 1 つも有効にしないと smoltcp の Socket 列挙が空になり、組み上がらない。
# ICMP の echo への自動応答は auto-icmp-echo-reply で囲まれており、無いと要求が捨てられる。
# defmt は、smoltcp が捨てたパケットなどのログと、ヘッダの型の表示を defmt に出す。
features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "auto-icmp-echo-reply", "defmt"]

# cargo run は開発用のビルドを使う。
# 命令メモリは 64 KB で、検査を入れた開発用のビルドは入りきらないため、リリースと同じ中身にする。
[profile.dev]
opt-level = "z"
lto = true
codegen-units = 1
debug-assertions = false
overflow-checks = false

# 命令メモリが限られるため、速度より大きさを優先する。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
