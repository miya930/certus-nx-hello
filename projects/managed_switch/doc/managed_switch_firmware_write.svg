<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-flash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6fa5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- 見出しと区切り -->
  <text x="180" y="32" text-anchor="middle" font-size="15" font-weight="bold">PC</text>
  <text x="500" y="32" text-anchor="middle" font-size="15" font-weight="bold">FPGA の中の NEORV32</text>
  <text x="835" y="32" text-anchor="middle" font-size="15" font-weight="bold">SPI Flash (MT25QU128)</text>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4 3">
    <line x1="335" y1="45" x2="335" y2="455"/>
    <line x1="665" y1="45" x2="665" y2="455"/>
  </g>

  <!-- PC -->
  <g stroke="#555" stroke-width="1.2" fill="#ffffff">
    <rect x="60" y="60" width="240" height="50"/>
    <rect x="60" y="140" width="240" height="70"/>
    <rect x="60" y="240" width="240" height="50"/>
    <rect x="60" y="370" width="240" height="60"/>
  </g>
  <g text-anchor="middle">
    <text x="180" y="82" font-family="'DejaVu Sans Mono', Consolas, monospace">cargo run</text>
    <text x="180" y="100" font-size="11" fill="#555">ELF を作り、runner を呼ぶ</text>
    <text x="180" y="162" font-size="12" font-family="'DejaVu Sans Mono', Consolas, monospace">tools/firmware_flash</text>
    <text x="180" y="182">firmware image を作る</text>
    <text x="180" y="200" font-size="11" fill="#555">"IMEM"、長さ、命令メモリの中身</text>
    <text x="180" y="262" font-family="'DejaVu Sans Mono', Consolas, monospace">probe-rs download</text>
    <text x="180" y="280" font-size="11" fill="#555">書き込みの進み具合を表示する</text>
    <text x="180" y="392" font-family="'DejaVu Sans Mono', Consolas, monospace">probe-rs run</text>
    <text x="180" y="412" font-size="11" fill="#555">defmt のログを表示する</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="110" x2="180" y2="138"/>
    <line x1="180" y1="210" x2="180" y2="238"/>
    <line x1="180" y1="290" x2="180" y2="368"/>
  </g>
  <text x="190" y="334" font-size="11" fill="#555">書き終えたら</text>

  <!-- cargo run-ram は Flash に書かない -->
  <path d="M60,85 H35 V400 H58" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="27" y="245" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace" transform="rotate(-90 27 245)">cargo run-ram</text>

  <!-- NEORV32 -->
  <g stroke-width="1.2">
    <rect x="365" y="225" width="270" height="80" fill="#eef4fb" stroke="#4a6fa5"/>
    <rect x="365" y="350" width="270" height="95" fill="#dff0e3" stroke="#2e7d32" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="500" y="248">書き込みプログラム</text>
    <text x="500" y="266" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace">flash_algorithms/mt25q</text>
    <text x="500" y="289" font-size="11" fill="#333">probe-rs がデータメモリに置いて呼ぶ</text>
    <text x="500" y="373">命令メモリに ELF を書き、</text>
    <text x="500" y="391">コアをリセットする</text>
    <text x="500" y="414" font-size="11" fill="#333">起動 ROM は命令メモリが空でないため、</text>
    <text x="500" y="431" font-size="11" fill="#333">コピーせずに先頭へ飛ぶ</text>
  </g>

  <!-- SPI Flash -->
  <rect x="695" y="225" width="280" height="80" fill="#dff0e3" stroke="#2e7d32" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="835" y="250" font-weight="bold">firmware image の区画</text>
    <text x="835" y="271" font-size="11" fill="#333">4 KB ずつ消してから、</text>
    <text x="835" y="289" font-size="11" fill="#333">256 バイトずつ書く</text>
  </g>

  <!-- PC と FPGA のあいだ -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="265" x2="363" y2="265"/>
    <line x1="300" y1="385" x2="363" y2="385"/>
  </g>
  <line x1="365" y1="420" x2="302" y2="420" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-log)"/>
  <g text-anchor="middle" font-size="11" fill="#555">
    <text x="332" y="258">JTAG</text>
    <text x="332" y="378">JTAG</text>
  </g>
  <text x="332" y="438" text-anchor="middle" font-size="11" fill="#4a6fa5">RTT</text>

  <!-- NEORV32 と Flash のあいだ -->
  <line x1="635" y1="265" x2="693" y2="265" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-flash)"/>
  <text x="664" y="258" text-anchor="middle" font-size="11" fill="#555">SPI</text>
</svg>
