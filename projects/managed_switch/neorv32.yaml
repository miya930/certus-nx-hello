# probe-rs に、このコアのメモリの位置を教える。
# 位置と大きさは hdl/managed_switch.vhd の generic と firmware/memory.x に合わせる。
# 命令メモリは RAM で、JTAG から書き込んだあとリセットすると、起動 ROM が先頭へ飛ぶ。
name: NEORV32
variants:
- name: managed_switch
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
  memory_map:
  - !Ram
    name: IMEM
    range:
      start: 0x00000000
      end: 0x00010000
    cores:
    - main
    access:
      boot: true
  - !Ram
    name: DMEM
    range:
      start: 0x80000000
      end: 0x80004000
    cores:
    - main
